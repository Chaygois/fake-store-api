services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db

  db:
    image: mongo
    restart: always
    # Usa named volume em vez de bind-mount
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

# Declaração de volumes (no fim do arquivo)
volumes:
  mongo_data:
